<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nawasuara Bali - AI Lens</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white d-flex flex-column align-items-center justify-content-center min-vh-100">

    <div class="container text-center" style="max-width: 450px;">
        <h2 class="mb-1 text-warning fw-bold">Nawasuara Bali</h2>
        <p class="text-secondary small mb-4">Arahkan kamera ke objek budaya Bali</p>

        <!-- Viewfinder Kamera -->
        <div class="position-relative mb-4 bg-black rounded overflow-hidden shadow-lg border border-warning" style="aspect-ratio: 3/4; width: 100%;">
            <video id="videoElement" class="w-100 h-100 object-fit-cover" autoplay playsinline></video>
            <div class="position-absolute top-50 start-50 translate-middle" style="width: 150px; height: 150px; border: 2px dashed rgba(255,193,7, 0.7); border-radius: 15px;"></div>
        </div>

        <canvas id="canvasElement" style="display: none;"></canvas>

        <!-- Tombol Scan -->
        <button id="scanBtn" class="btn btn-warning btn-lg fw-bold rounded-pill px-5 py-3 shadow">
            🔍 Potret & Pelajari
        </button>

        <!-- Area Hasil -->
        <div id="resultContainer" class="mt-4 p-3 bg-secondary bg-opacity-25 rounded d-none text-start">
            <div id="loadingIndicator" class="d-none text-center py-2">
                <div class="spinner-border text-warning spinner-border-sm" role="status"></div>
                <span class="ms-2">AI sedang menganalisis...</span>
            </div>
            <p id="resultText" class="mb-0 text-light fw-medium lh-lg"></p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
